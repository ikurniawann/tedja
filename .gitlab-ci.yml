include:
  - project: 'devops/ci-cd-template'
    ref: development          # pin to a tag once this repo starts tagging releases
    file: '.gitlab-ci.yml'

# COMPOSE_SERVICE_NAME is baked into each deploy-*/rollback-* job's own
# `variables:` (default "CHANGE-ME") -- GitLab's include-merge deep-merges a
# job redeclared locally with the included one (local wins per key, rest of
# the job -- stage/image/script/rules/needs -- comes from the include), so
# redeclaring just `variables:` here is enough; no need to copy the whole job.
deploy-development:
  variables: {COMPOSE_SERVICE_NAME: "arkiv"}

deploy-production:
  variables: {COMPOSE_SERVICE_NAME: "arkiv"}

rollback-development:
  variables: {COMPOSE_SERVICE_NAME: "arkiv"}

rollback-production:
  variables: {COMPOSE_SERVICE_NAME: "arkiv"}
