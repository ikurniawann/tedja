stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: arkiv
  CONTAINER_NAME: arkiv
  HOST_PORT: 3004
  CONTAINER_PORT: 3000
  DB_HOST: host.docker.internal
  DB_PORT: 5435
  DB_NAME: arkiv
  DB_USER: arkiv
  DB_PASS: 301010**
  NODE_ENV: production
  NEXT_PUBLIC_APP_URL: https://sulu.within.ventures
  NEXT_PUBLIC_BASE_URL: https://sulu.within.ventures

before_script:
  - cd /mnt/hdd1tb/arkiv

build:
  stage: build
  script:
    - git pull origin development
    - docker build -t $DOCKER_IMAGE:latest .
  only:
    - development

deploy:
  stage: deploy
  script:
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - |
      docker run -d \
        --name $CONTAINER_NAME \
        --restart unless-stopped \
        -p 127.0.0.1:$HOST_PORT:$CONTAINER_PORT \
        --add-host host.docker.internal:host-gateway \
        -e DATABASE_URL="postgresql://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/$DB_NAME" \
        -e MIGRATE_DATABASE_URL="postgresql://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/$DB_NAME" \
        -e NODE_ENV=$NODE_ENV \
        -e NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL \
        -e NEXT_PUBLIC_BASE_URL=$NEXT_PUBLIC_BASE_URL \
        $DOCKER_IMAGE:latest
    - docker system prune -f
  only:
    - development
